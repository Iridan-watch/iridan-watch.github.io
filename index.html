<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>리센느 악플 모니터링</title>
<style>
  :root {
    --bg: #f6f5f2; --panel: #ffffff; --ink: #1d1c1a; --muted: #6b6862; --line: #e4e1db;
    --accent: #5b4bd6; --s3: #c2372b; --s2: #d9822b; --s1: #8a8578; --chip: #efede8;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151517; --panel: #1e1e21; --ink: #ecebe8; --muted: #a09d96; --line: #2f2f33;
            --accent: #a99cff; --s3: #ff6b5e; --s2: #f0a54a; --s1: #9a968d; --chip: #2a2a2e; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.6 "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; }
  .wrap { max-width: 920px; margin: 0 auto; padding: 32px 20px 64px; }
  header h1 { font-size: 26px; margin: 0 0 4px; letter-spacing: -0.02em; }
  header p { margin: 0; color: var(--muted); font-size: 14px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 22px 0; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .stat b { display: block; font-size: 24px; letter-spacing: -0.02em; }
  .stat span { color: var(--muted); font-size: 13px; }
  .notice { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--accent);
            border-radius: 10px; padding: 12px 16px; font-size: 14px; color: var(--muted); margin-bottom: 20px; }
  .notice strong { color: var(--ink); }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px;
              position: sticky; top: 0; background: var(--bg); padding: 10px 0; z-index: 2; }
  .controls input, .controls select {
    font: inherit; font-size: 14px; color: var(--ink); background: var(--panel);
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
  .controls input[type=search] { flex: 1 1 220px; }
  .controls label { font-size: 14px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
  .count { color: var(--muted); font-size: 13px; margin: 0 0 10px; }
  .item { background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
          padding: 14px 16px; margin-bottom: 10px; display: grid; gap: 8px; }
  .item.done { opacity: .5; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12.5px; }
  .tag { background: var(--chip); border-radius: 999px; padding: 2px 10px; }
  .sev { color: #fff; font-weight: 700; border-radius: 999px; padding: 2px 10px; }
  .sev-3 { background: var(--s3); } .sev-2 { background: var(--s2); } .sev-1 { background: var(--s1); }
  .text { font-size: 16px; white-space: pre-wrap; word-break: break-word; }
  .reason { color: var(--muted); font-size: 13.5px; }
  .foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--muted); }
  .foot a { color: var(--accent); font-weight: 600; text-decoration: none; }
  .foot a:hover { text-decoration: underline; }
  .video { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 60%; }
  .tag.kind-in { background: var(--accent); color: #fff; }
  .tag.suspect { border: 1px dashed var(--muted); background: transparent; }
  .implied { font-size: 14px; border-left: 3px solid var(--accent); padding: 2px 0 2px 10px; }
  .implied b { color: var(--accent); }
  .themes { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 20px; }
  .themes h2 { font-size: 15px; margin: 0 0 10px; }
  .theme { display: grid; grid-template-columns: minmax(120px, 34%) 1fr 64px; gap: 10px; align-items: center;
           font-size: 13.5px; padding: 4px 0; cursor: pointer; border: 0; background: none; color: inherit; width: 100%; text-align: left; font-family: inherit; }
  .theme:hover .bar, .theme.on .bar { background: var(--accent); }
  .theme .bar { height: 10px; border-radius: 5px; background: var(--s1); }
  .theme .n { color: var(--muted); text-align: right; }
  .empty { text-align: center; color: var(--muted); padding: 48px 0; }
  footer { margin-top: 36px; font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>리센느 악플 모니터링</h1>
    <p id="updated">불러오는 중…</p>
  </header>

  <section class="stats" id="stats"></section>
  <section class="themes" id="themes" hidden>
    <h2>최근 7일 반복되는 부정적 서사 <span style="font-weight:400;color:var(--muted);font-size:13px">· 누르면 해당 댓글만 보기</span></h2>
    <div id="themeList"></div>
  </section>

  <div class="notice">
    <strong>이용 안내</strong> · AI가 판정한 목록이라 오판이 섞여 있을 수 있어요. <strong>‘의심’</strong> 표시는 사람이 꼭 확인해야 하는 항목이에요.
    제보 전에 <strong>‘원 댓글 보기’</strong>로 직접 확인해 주세요.
    작성자 정보는 표시하지 않으며, 작성자에게 직접 대응하기보다 소속사 제보 창구와 YouTube 신고 기능을 이용해 주세요.
  </div>

  <div class="controls">
    <input type="search" id="q" placeholder="댓글·영상 제목 검색">
    <select id="sev">
      <option value="0">심각도 전체</option>
      <option value="3">3 (심각)만</option>
      <option value="2">2 이상</option>
    </select>
    <select id="conf">
      <option value="">확실+의심</option>
      <option value="확실">확실만</option>
      <option value="의심">의심만</option>
    </select>
    <select id="kind">
      <option value="">종류 전체</option>
      <option value="돌려까기">돌려까기</option>
      <option value="직접 비하">직접 비하</option>
    </select>
    <select id="cat"><option value="">유형 전체</option></select>
    <select id="sort">
      <option value="sev">심각도순</option>
      <option value="new">최신순</option>
    </select>
    <label><input type="checkbox" id="hideDone"> 내가 확인한 것 숨기기</label>
  </div>
  <p class="count" id="count"></p>
  <main id="list"></main>

  <footer>
    YouTube 공개 댓글을 자동 수집해 하루 두 번 갱신합니다. 삭제된 댓글은 링크가 열리지 않을 수 있어요.
  </footer>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const store = {
    get() { try { return new Set(JSON.parse(localStorage.getItem("rescene-done") || "[]")); } catch { return new Set(); } },
    set(s) { try { localStorage.setItem("rescene-done", JSON.stringify([...s])); } catch {} },
  };
  let data = { items: [] };
  let theme = "";
  let done = store.get();

  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const fmt = (n) => Number(n || 0).toLocaleString("ko-KR");

  function render() {
    const q = $("q").value.trim().toLowerCase();
    const minSev = Number($("sev").value);
    const cat = $("cat").value;
    const conf = $("conf").value;
    const kind = $("kind").value;
    const hide = $("hideDone").checked;
    let items = data.items.filter((it) =>
      it.severity >= minSev &&
      (!cat || it.category === cat) &&
      (!conf || it.confidence === conf) &&
      (!kind || it.kind === kind) &&
      (!theme || it.theme === theme) &&
      (!hide || !done.has(it.link)) &&
      (!q || (it.text + " " + it.video + " " + (it.implied || "")).toLowerCase().includes(q)));
    items.sort($("sort").value === "new"
      ? (a, b) => b.posted.localeCompare(a.posted)
      : (a, b) => (a.confidence === "의심") - (b.confidence === "의심") || b.severity - a.severity || b.posted.localeCompare(a.posted));

    $("count").textContent = `${fmt(items.length)}건 표시 중 (전체 ${fmt(data.items.length)}건)`;
    $("list").innerHTML = items.length ? items.map((it) => `
      <article class="item ${done.has(it.link) ? "done" : ""}">
        <div class="meta">
          <span class="sev sev-${it.severity}">심각도 ${it.severity}</span>
          ${it.confidence === "의심" ? `<span class="tag suspect">의심 · 확인 필요</span>` : ""}
          ${it.kind ? `<span class="tag ${it.kind === "돌려까기" ? "kind-in" : ""}">${esc(it.kind)}</span>` : ""}
          <span class="tag">${esc(it.category)}</span>
          ${it.target ? `<span class="tag">대상: ${esc(it.target)}</span>` : ""}
          <span>${esc(it.posted)} 작성</span>
        </div>
        <div class="text">${esc(it.text)}</div>
        ${it.implied ? `<div class="implied"><b>숨은 의미</b> ${esc(it.implied)}</div>` : ""}
        ${it.reason ? `<div class="reason">판정 근거: ${esc(it.reason)}</div>` : ""}
        <div class="foot">
          <span class="video" title="${esc(it.video)}">📺 ${esc(it.video)} · ${esc(it.channel)}</span>
          <span>
            <label><input type="checkbox" data-link="${esc(it.link)}" ${done.has(it.link) ? "checked" : ""}> 확인함</label>
            &nbsp;<a href="${esc(it.link)}" target="_blank" rel="noopener noreferrer">원 댓글 보기 ↗</a>
          </span>
        </div>
      </article>`).join("") : `<div class="empty">조건에 맞는 댓글이 없어요.</div>`;
  }

  $("list").addEventListener("change", (e) => {
    const link = e.target.dataset && e.target.dataset.link;
    if (!link) return;
    e.target.checked ? done.add(link) : done.delete(link);
    store.set(done);
    render();
  });
  ["q", "sev", "conf", "kind", "cat", "sort", "hideDone"].forEach((id) => $(id).addEventListener("input", render));

  fetch("data.json", { cache: "no-store" })
    .then((r) => r.json())
    .then((d) => {
      data = d;
      $("updated").textContent = `${d.since} 이후 업로드된 영상 기준 · 마지막 갱신 ${d.updated_at} (KST)`;
      $("stats").innerHTML = [
        [fmt(d.items.length), "찾은 악플 (확실+의심)"],
        [fmt(d.items.filter((i) => i.kind === "돌려까기").length), "돌려까기"],
        [fmt(d.comments_checked), "검토한 댓글"],
        [fmt(d.videos_tracked), "추적 중인 영상"],
      ].map(([b, s]) => `<div class="stat"><b>${b}</b><span>${s}</span></div>`).join("");
      const themes = (d.themes_7d && d.themes_7d.length ? d.themes_7d : d.themes_all) || [];
      if (themes.length) {
        const max = Math.max(...themes.map((t) => t.count));
        $("themes").hidden = false;
        $("themeList").innerHTML = themes.map((t) => `
          <button class="theme" data-theme="${esc(t.theme)}">
            <span>${esc(t.theme)}</span>
            <span class="bar" style="width:${Math.max(4, (t.count / max) * 100)}%"></span>
            <span class="n">${fmt(t.count)}건</span>
          </button>`).join("");
        $("themeList").addEventListener("click", (e) => {
          const b = e.target.closest(".theme"); if (!b) return;
          theme = theme === b.dataset.theme ? "" : b.dataset.theme;
          document.querySelectorAll(".theme").forEach((x) => x.classList.toggle("on", x.dataset.theme === theme));
          render();
        });
      }
      [...new Set(d.items.map((i) => i.category))].sort().forEach((c) =>
        $("cat").insertAdjacentHTML("beforeend", `<option>${esc(c)}</option>`));
      render();
    })
    .catch(() => { $("updated").textContent = "데이터를 불러오지 못했어요. 잠시 후 다시 시도해 주세요."; });
})();
</script>
</body>
</html>
